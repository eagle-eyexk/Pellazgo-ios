workflows:
  pellazgo-ios:
    name: Pellazgo – iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # ── Code signing ─────────────────────────────────────────────────────────
      # Pulls the "PellazgoApp" app_store certificate stored under
      # Codemagic → Teams (Bardh Idrizi) → Code signing identities.
      # No CERTIFICATE_PRIVATE_KEY env var needed — Codemagic fetches it.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo

      # ── App Store Connect API key ─────────────────────────────────────────────
      # Create a variable group called "pellazgo_asc" in:
      #   Codemagic → Teams (Bardh Idrizi) → Global variables & secrets
      # Add these three variables (mark each as Secure ↗):
      #   APP_STORE_CONNECT_KEY_IDENTIFIER  →  A8472N678Q
      #   APP_STORE_CONNECT_ISSUER_ID       →  (copy from App Store Connect → Users → Integrations → Keys)
      #   APP_STORE_CONNECT_PRIVATE_KEY     →  (paste full contents of AuthKey_A8472N678Q.p8)
      groups:
        - pellazgo_asc

      vars:
        BUNDLE_ID: com.pellazgo.pellazgo
        APP_STORE_APPLE_ID: "6782613978"
        EXPO_DIR: artifacts/pellazgo
        IOS_DIR: artifacts/pellazgo/ios
        XCODE_SCHEME: Pellazgo
        # Prevents corepack from intercepting pnpm installs and failing
        # on its signature-verification keystore (hits pnpm@latest on Node LTS)
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_ENABLE_AUTO_PIN: "0"

      node: lts
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install pnpm
        script: |
          # Disable corepack so it never intercepts the pnpm install
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10
          pnpm --version

      - name: Install workspace dependencies
        script: |
          # Install only the Expo app's deps — no need for the full monorepo on CI
          cd "$EXPO_DIR"
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild – generate native iOS project
        script: |
          cd "$EXPO_DIR"
          npx expo prebuild --platform ios --clean --no-install

      - name: Detect Xcode workspace name
        script: |
          # Find workspace name and store it relative to EXPO_DIR (where build cmds run)
          WS_NAME=$(find "$IOS_DIR" -maxdepth 1 -name "*.xcworkspace" -type d | head -1 | xargs basename)
          if [ -z "$WS_NAME" ]; then
            echo "ERROR: No .xcworkspace found in $IOS_DIR" >&2
            exit 1
          fi
          echo "XCODE_WORKSPACE=ios/$WS_NAME" >> $CM_ENV
          echo "Found workspace: ios/$WS_NAME"

      - name: Install CocoaPods
        script: |
          cd "$IOS_DIR"
          pod install --repo-update

      - name: Increment build number from latest TestFlight
        script: |
          cd "$IOS_DIR"
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          BUILD=$(( LATEST + 1 ))
          echo "Setting build number to $BUILD"
          agvtool new-version -all "$BUILD"
          agvtool new-marketing-version 1.0.0

      - name: Apply provisioning profiles
        script: |
          cd "$EXPO_DIR"
          xcode-project use-profiles

      - name: Build & export IPA
        script: |
          cd "$EXPO_DIR"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - artifacts/pellazgo/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
      email:
        recipients:
          - builds@pellazgo.com   # ← replace with your actual address
        notify:
          success: true
          failure: true
