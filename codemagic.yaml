workflows:
  pellazgo-ios:
    name: Pellazgo iOS Release
    max_build_duration: 90

    integrations:
      app_store_connect: pellazgo_asc

    environment:
      xcode: 16.4
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo

      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"

        PROJECT_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"

        WORKSPACE: "Pellazgo.xcworkspace"
        SCHEME: "Pellazgo"

        EXPO_USE_METRO_WORKSPACE_ROOT: "1"

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true

    scripts:

      - name: Install pnpm
        script: |
          npm install -g pnpm

      - name: Install dependencies
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          pnpm install --no-frozen-lockfile

      - name: Verify Expo project
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la

          echo "Searching App entry:"
          find . -maxdepth 2 \( -name "App.js" -o -name "App.jsx" -o -name "App.tsx" \)

          echo "Searching Expo Router:"
          find . -maxdepth 2 -type d -name "app"

          echo "Package:"
          cat package.json

      - name: Expo prebuild
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"

          npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          pod install

      - name: Configure signing
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          xcode-project use-profiles

      - name: Increment build number
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0)

          BUILD_NUMBER=$((BUILD_NUMBER + 1))

          cd "$CM_BUILD_DIR/$IOS_DIR"

          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          export PROJECT_ROOT="$CM_BUILD_DIR/$PROJECT_DIR"

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --archive-flags="-configuration Release"


    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log


    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        
