workflows:
  pellazgo-ios:
    name: Pellazgo iOS - TestFlight & App Store

    max_build_duration: 90

    integrations:
      app_store_connect: pellazgo_asc


    environment:

      # Required for current App Store Connect uploads
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo


      vars:

        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"

        EXPO_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"

        XCODE_WORKSPACE: "artifacts/pellazgo/ios/Pellazgo.xcworkspace"
        XCODE_SCHEME: "Pellazgo"

        EXPO_NO_TELEMETRY: "1"
        COREPACK_INTEGRITY_KEYS: "0"



    triggering:

      events:
        - push

      branch_patterns:

        - pattern: main
          include: true



    scripts:


      - name: Install pnpm

        script: |
          corepack enable
          corepack prepare pnpm@10 --activate

          node -v
          pnpm -v



      - name: Install dependencies

        script: |
          cd "$CM_BUILD_DIR"

          pnpm install --no-frozen-lockfile



      - name: Expo prebuild

        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"

          node_modules/.bin/expo prebuild \
            --platform ios \
            --clean \
            --no-install



      - name: Patch Podfile safely

        script: |

          cd "$CM_BUILD_DIR/$IOS_DIR"


          python3 <<'PY'

          from pathlib import Path


          podfile = Path("Podfile")


          if not podfile.exists():
              raise SystemExit("Podfile not found")


          content = podfile.read_text()


          if "PELLAZGO_BUILD_FIX" in content:
              print("Podfile already patched")
              exit(0)



          fix = r'''

            # PELLAZGO_BUILD_FIX

            installer.pods_project.targets.each do |target|

              target.build_configurations.each do |config|

                config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS'] = 'NO'

                config.build_settings['SWIFT_TREAT_WARNINGS_AS_ERRORS'] = 'NO'

                config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'

                config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'

                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1'


              end


            end

          '''



          if "post_install do |installer|" not in content:

              raise SystemExit(
                "Expo Podfile has no post_install block"
              )



          content = content.replace(

              "post_install do |installer|",

              "post_install do |installer|" + fix,

              1

          )



          podfile.write_text(content)


          print("Podfile patch completed")


          PY



      - name: Install CocoaPods

        script: |

          cd "$CM_BUILD_DIR/$IOS_DIR"


          rm -rf Pods

          rm -f Podfile.lock


          pod deintegrate || true


          pod install --repo-update



      - name: Increase build number

        script: |

          BUILD_NUMBER=$(
            app-store-connect get-latest-testflight-build-number "$APP_ID" \
            2>/dev/null || echo 0
          )


          BUILD_NUMBER=$((BUILD_NUMBER + 1))


          cd "$CM_BUILD_DIR/$IOS_DIR"


          agvtool new-version -all "$BUILD_NUMBER"



      - name: Setup signing

        script: |

          cd "$CM_BUILD_DIR/$IOS_DIR"


          xcode-project use-profiles



      - name: Build IPA

        script: |

          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release"



    artifacts:

      - build/ios/ipa/*.ipa

      - /tmp/xcodebuild_logs/*.log

      - $HOME/Library/Logs/gym/*.log



    publishing:


      app_store_connect:

        auth: integration

        submit_to_testflight: true

        submit_to_app_store: false