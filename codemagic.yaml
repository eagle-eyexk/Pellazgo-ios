workflows:
  pellazgo-ios:
    name: Pellazgo iOS - TestFlight & App Store
    max_build_duration: 60
    integrations:
      app_store_connect: pellazgo_asc

    environment:
      ios_signing:
        provisioning_profiles:
          - Pellazgo_AppStore
        certificates:
          - PellazgoApp
      xcode: latest
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        EXPO_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"
        XCODE_SCHEME: "Pellazgo"
        # Codemagic's macOS agents ship with an old corepack whose keystore
        # predates pnpm 10 — signature verification always fails.
        # Setting this to 0 disables the check so corepack can activate pnpm.
        COREPACK_INTEGRITY_KEYS: "0"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install pnpm
        script: |
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10
          pnpm --version

      - name: Install app dependencies
        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          pod install --repo-update

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || \
                   app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null || \
                   echo "0")
          cd "$CM_BUILD_DIR/$IOS_DIR"
          agvtool new-version -all $(( LATEST + 1 ))

      - name: Set up code signing
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/$IOS_DIR" -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          xcode-project use-profiles --workspace "$WORKSPACE"

      - name: Build IPA
        script: |
          WORKSPACE=$(find "$CM_BUILD_DIR/$IOS_DIR" -maxdepth 1 -name "*.xcworkspace" -type d | head -1)
          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
