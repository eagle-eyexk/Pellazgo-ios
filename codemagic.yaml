workflows:
  pellazgo-ios:
    name: Pellazgo iOS - TestFlight & App Store
    max_build_duration: 90
    integrations:
      app_store_connect: pellazgo_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      # Apple now requires the iOS 26 SDK (Xcode 26) for all App Store uploads.
      # The Podfile patch step below (CLANG_CXX_LANGUAGE_STANDARD=c++20 + libc++)
      # fixes the fmt/glog C++ compile errors that Xcode 26's stricter clang
      # would otherwise cause in RN 0.79.
      xcode: latest
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        EXPO_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"
        XCODE_SCHEME: "Pellazgo"
        XCODE_WORKSPACE: "artifacts/pellazgo/ios/Pellazgo.xcworkspace"
        COREPACK_INTEGRITY_KEYS: "0"
        EXPO_NO_TELEMETRY: "1"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install pnpm
        script: |
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10
          pnpm --version

      - name: Install app dependencies
        script: |
          cd "$CM_BUILD_DIR"
          pnpm install --filter @workspace/pellazgo... --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"
          # Use the locally-installed expo binary directly so we never accidentally
          # pull a different version via npx's global cache.
          node_modules/.bin/expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile – fix fmt/glog C++ standard
        script: |
          # Expo prebuild regenerates the Podfile every run, so we patch after.
          # Uses regex so whitespace differences in expo's template don't matter.
          python3 << 'PYEOF'
          import re, os, sys

          podfile = os.path.join(
              os.environ["CM_BUILD_DIR"], os.environ["IOS_DIR"], "Podfile"
          )
          with open(podfile) as f:
              src = f.read()

          # Use a unique sentinel so we never false-skip because Expo's own
          # template happens to mention CLANG_CXX_LANGUAGE_STANDARD.
          SENTINEL = "# RN79_XCODE26_PATCH"
          if SENTINEL in src:
              print("Podfile already patched — skipping")
              sys.exit(0)

          # Two-part fix for RN 0.79 on Apple clang 19 (Xcode 26):
          #
          # 1. All pods:
          #    - GCC_TREAT_WARNINGS_AS_ERRORS = NO  (clang 19 promotes many
          #      previously-warning constructs to hard errors)
          #    - CLANG_CXX_LANGUAGE_STANDARD = c++20 + CLANG_CXX_LIBRARY = libc++
          #      (required by React Native new arch headers)
          #
          # 2. fmt + glog specifically:
          #    - Override to c++17  (their bundled source is not strict-c++20-clean
          #      under clang 19; format.cc / logging.cc fail to compile otherwise)
          #    - OTHER_CPLUSPLUSFLAGS += -w  (suppress all warnings so clang 19's
          #      new pedantic checks don't become errors even with the override)
          #      The append handles both String and Array values to avoid a Ruby
          #      TypeError if CocoaPods stores the setting as an Array internally.
          insert = (
            "\n"
            "  # RN79_XCODE26_PATCH — do not remove this sentinel comment\n"
            "  # ── RN 0.79 + Xcode 26 (Apple clang 19) compatibility patch ──\n"
            "  #\n"
            "  # Pass 1 – every pod:\n"
            "  #   GCC_TREAT_WARNINGS_AS_ERRORS=NO   clang 19 promotes more constructs to errors\n"
            "  #   CLANG_CXX_LANGUAGE_STANDARD=c++20  RN new-arch headers require c++20\n"
            "  #   CLANG_CXX_LIBRARY=libc++           always use libc++\n"
            "  #   IPHONEOS_DEPLOYMENT_TARGET>=15.1   iOS 26 SDK availability guards require\n"
            "  #                                      an explicit deployment target; pods that\n"
            "  #                                      ship without one (or with iOS 9/10) trigger\n"
            "  #                                      hard errors in the new SDK headers.\n"
            "  installer.pods_project.targets.each do |target|\n"
            "    target.build_configurations.each do |config|\n"
            "      config.build_settings['GCC_TREAT_WARNINGS_AS_ERRORS']   = 'NO'\n"
            "      config.build_settings['SWIFT_TREAT_WARNINGS_AS_ERRORS'] = 'NO'\n"
            "      config.build_settings['CLANG_CXX_LANGUAGE_STANDARD']    = 'c++20'\n"
            "      config.build_settings['CLANG_CXX_LIBRARY']              = 'libc++'\n"
            "      min = (config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] || '0').to_f\n"
            "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.1' if min < 15.1\n"
            "    end\n"
            "  end\n"
            "  #\n"
            "  # Pass 2 – fmt and glog only:\n"
            "  #   CLANG_CXX_LANGUAGE_STANDARD=c++14  most conservative — avoids C++17 removals\n"
            "  #                                      (std::binary_function, etc.) that old fmt\n"
            "  #                                      6.x still uses and clang 19 rejects\n"
            "  #   OTHER_CPLUSPLUSFLAGS += -w          suppress every remaining warning\n"
            "  #   -DFMT_USE_CONSTEXPR=0               disable fmt's constexpr paths — the\n"
            "  #                                      primary source of hard errors under\n"
            "  #                                      clang 19's stricter constexpr evaluation\n"
            "  installer.pods_project.targets.each do |target|\n"
            "    next unless ['fmt', 'glog'].include?(target.name)\n"
            "    target.build_configurations.each do |config|\n"
            "      config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++14'\n"
            "      existing = config.build_settings['OTHER_CPLUSPLUSFLAGS']\n"
            "      extra = '-w -DFMT_USE_CONSTEXPR=0'\n"
            "      config.build_settings['OTHER_CPLUSPLUSFLAGS'] =\n"
            "        case existing\n"
            "        when Array  then existing + extra.split\n"
            "        when String then existing + ' ' + extra\n"
            "        else             '$(inherited) ' + extra\n"
            "        end\n"
            "    end\n"
            "  end\n"
          )

          patched = re.sub(
              r"(post_install\s+do\s+\|installer\|)",
              r"\1" + insert,
              src,
              count=1,
          )

          if patched == src:
              print("ERROR: post_install block not found in Podfile", file=sys.stderr)
              print(src[:500])
              sys.exit(1)

          with open(podfile, "w") as f:
              f.write(patched)
          print("Podfile patched — fmt/glog -> c++14 -w -DFMT_USE_CONSTEXPR=0, all pods -> GCC_TREAT_WARNINGS_AS_ERRORS=NO + IPHONEOS_DEPLOYMENT_TARGET>=15.1")
          PYEOF

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          pod install --repo-update

      - name: Patch fmt source – disable constexpr for clang 19
        script: |
          # Belt-and-suspenders: directly prepend compatibility defines to
          # fmt/src/format.cc AFTER pod install writes the source tree.
          #
          # Why: GCC_TREAT_WARNINGS_AS_ERRORS=NO + c++14 + -w (set in the
          # Podfile post_install block above) suppress warnings but cannot
          # suppress hard compilation ERRORS.  fmt 6.x's constexpr paths
          # produce hard errors under Apple clang 19 / Xcode 26 because the
          # compiler evaluates constexpr expressions more strictly.
          # Prepending FMT_USE_CONSTEXPR=0 forces fmt to use ordinary runtime
          # code paths everywhere, which compile cleanly under any clang.
          #
          # The sentinel comment prevents double-patching on retried builds.
          FMT_SRC="$CM_BUILD_DIR/$IOS_DIR/Pods/fmt/src/format.cc"
          if [ ! -f "$FMT_SRC" ]; then
            echo "WARNING: $FMT_SRC not found — skipping fmt source patch"
            exit 0
          fi
          if grep -q "XCODE26_COMPAT" "$FMT_SRC"; then
            echo "fmt source already patched — skipping"
            exit 0
          fi
          printf '// XCODE26_COMPAT: disable fmt constexpr for Apple clang 19\n// This shim is injected by codemagic.yaml; do not commit to source control.\n#undef  FMT_USE_CONSTEXPR\n#define FMT_USE_CONSTEXPR 0\n#undef  FMT_CONSTEXPR\n#define FMT_CONSTEXPR\n#undef  FMT_CONSTEXPR14\n#define FMT_CONSTEXPR14\n\n' \
            | cat - "$FMT_SRC" > /tmp/fmt_patched.cc
          mv /tmp/fmt_patched.cc "$FMT_SRC"
          echo "fmt source patched — FMT_USE_CONSTEXPR=0 applied to $FMT_SRC"

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null \
            || app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null \
            || echo "0")
          LATEST=$(echo "$LATEST" | tr -d '[:space:]')
          cd "$CM_BUILD_DIR/$IOS_DIR"
          agvtool new-version -all $(( ${LATEST:-0} + 1 ))

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
