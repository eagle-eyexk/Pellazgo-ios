workflows:
  pellazgo-ios:
    name: Pellazgo iOS - TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: pellazgo_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      xcode: latest
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        EXPO_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"
        XCODE_SCHEME: "Pellazgo"
        XCODE_WORKSPACE: "artifacts/pellazgo/ios/Pellazgo.xcworkspace"
        # Codemagic macOS agents ship with old corepack whose keystore
        # predates pnpm 10 — disabling integrity check so Enable pnpm passes.
        COREPACK_INTEGRITY_KEYS: "0"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install pnpm
        script: |
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10
          pnpm --version

      - name: Install app dependencies
        script: |
          cd "$CM_BUILD_DIR"
          pnpm install --filter @workspace/pellazgo... --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile for C++ compatibility
        script: |
          # React Native 0.79 + Xcode: fmt/glog pods fail to compile without C++20.
          # Expo prebuild regenerates the Podfile each time, so we patch it here.
          python3 << 'EOF'
          import os

          ios_dir = os.path.join(os.environ["CM_BUILD_DIR"], os.environ["IOS_DIR"])
          podfile_path = os.path.join(ios_dir, "Podfile")

          with open(podfile_path) as f:
              content = f.read()

          insert = (
              "\n"
              "  # Fix: fmt/glog C++ compilation errors with RN 0.79 and Xcode\n"
              "  installer.pods_project.targets.each do |target|\n"
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'\n"
              "    end\n"
              "  end\n"
          )

          # Insert into the first post_install block expo generates
          content = content.replace(
              "post_install do |installer|",
              "post_install do |installer|" + insert,
              1,
          )

          with open(podfile_path, "w") as f:
              f.write(content)

          print("Podfile patched — CLANG_CXX_LANGUAGE_STANDARD = c++20 applied to all Pod targets")
          EOF

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          pod install --repo-update

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null \
            || app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null \
            || echo "0")
          LATEST=$(echo "$LATEST" | tr -d '[:space:]')
          cd "$CM_BUILD_DIR/$IOS_DIR"
          agvtool new-version -all $(( ${LATEST:-0} + 1 ))

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
