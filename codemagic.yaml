workflows:
  pellazgo-ios:
    name: Pellazgo iOS – TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.pellazgo.pellazgo
        XCODE_WORKSPACE: ios/Pellazgo.xcworkspace
        XCODE_SCHEME: Pellazgo
        APP_STORE_APPLE_ID: "6782613978"
      groups:
        # Create these groups in Codemagic → Teams → Global variables & secrets
        # Group: pellazgo_asc  (add the variables below to this group)
        #   APP_STORE_CONNECT_KEY_IDENTIFIER   = A8472N678Q
        #   APP_STORE_CONNECT_ISSUER_ID        = <your Issuer ID from App Store Connect>
        #   APP_STORE_CONNECT_PRIVATE_KEY      = <contents of AuthKey_A8472N678Q.p8>
        #   CERTIFICATE_PRIVATE_KEY            = <your distribution certificate private key (RSA PEM)>
        - pellazgo_asc
      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@latest
          pnpm --version

      - name: Install dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Set up Expo
        script: |
          pnpm --filter @workspace/pellazgo exec npx expo install --fix
          pnpm --filter @workspace/pellazgo exec npx expo-doctor || true

      - name: Expo Prebuild (generate native iOS project)
        script: |
          cd artifacts/pellazgo
          npx expo prebuild --platform ios --clean --no-install \
            --npm-client pnpm

      - name: Install CocoaPods
        script: |
          cd artifacts/pellazgo/ios
          pod install

      - name: Set app version & build number
        script: |
          # Use Codemagic build number for CFBundleVersion
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST + 1))
          agvtool new-marketing-version 1.0.0

      - name: Build iOS app (archive)
        script: |
          xcode-project use-profiles
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/Pellazgo.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            | xcpretty --color

      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # Uses APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
        # APP_STORE_CONNECT_PRIVATE_KEY from the pellazgo_asc group above.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
      email:
        recipients:
          - builds@pellazgo.com   # replace with your email
        notify:
          success: true
          failure: true
