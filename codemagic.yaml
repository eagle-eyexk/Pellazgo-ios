workflows:
  pellazgo-ios:
    name: Pellazgo iOS - TestFlight & App Store
    max_build_duration: 60
    integrations:
      app_store_connect: pellazgo_asc

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo
      # Xcode 26 (latest) breaks RN 0.79's bundled fmt/glog with its new clang.
      # 16.2 is the last release fully validated against RN 0.79.
      xcode: 16.2
      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        EXPO_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"
        XCODE_SCHEME: "Pellazgo"
        XCODE_WORKSPACE: "artifacts/pellazgo/ios/Pellazgo.xcworkspace"
        COREPACK_INTEGRITY_KEYS: "0"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install pnpm
        script: |
          corepack disable 2>/dev/null || true
          npm install -g pnpm@10
          pnpm --version

      - name: Install app dependencies
        script: |
          cd "$CM_BUILD_DIR"
          pnpm install --filter @workspace/pellazgo... --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd "$CM_BUILD_DIR/$EXPO_DIR"
          npx expo prebuild --platform ios --clean --no-install

      - name: Patch Podfile – fix fmt/glog C++ standard
        script: |
          # Expo prebuild regenerates the Podfile every run, so we patch after.
          # Uses regex so whitespace differences in expo's template don't matter.
          python3 << 'PYEOF'
          import re, os, sys

          podfile = os.path.join(
              os.environ["CM_BUILD_DIR"], os.environ["IOS_DIR"], "Podfile"
          )
          with open(podfile) as f:
              src = f.read()

          if "CLANG_CXX_LANGUAGE_STANDARD" in src:
              print("Podfile already patched — skipping")
              sys.exit(0)

          insert = """\n  # Fix: fmt/glog C++ compile errors on RN 0.79 (Xcode 16+)\n  installer.pods_project.targets.each do |target|\n    target.build_configurations.each do |config|\n      config.build_settings['CLANG_CXX_LANGUAGE_STANDARD'] = 'c++20'\n      config.build_settings['CLANG_CXX_LIBRARY'] = 'libc++'\n    end\n  end\n"""

          patched = re.sub(
              r"(post_install\s+do\s+\|installer\|)",
              r"\1" + insert,
              src,
              count=1,
          )

          if patched == src:
              print("ERROR: post_install block not found in Podfile", file=sys.stderr)
              print(src[:500])
              sys.exit(1)

          with open(podfile, "w") as f:
              f.write(patched)
          print("Podfile patched — CLANG_CXX_LANGUAGE_STANDARD=c++20 + libc++ applied")
          PYEOF

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          pod install --repo-update

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null \
            || app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null \
            || echo "0")
          LATEST=$(echo "$LATEST" | tr -d '[:space:]')
          cd "$CM_BUILD_DIR/$IOS_DIR"
          agvtool new-version -all $(( ${LATEST:-0} + 1 ))

      - name: Set up code signing
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-configuration Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight automatically on every successful build.
        submit_to_testflight: true
        # App Store review submission requires screenshots, description, age
        # rating, privacy policy URL, etc. to be filled in App Store Connect
        # first. Keep this false so CI never fails on missing metadata — submit
        # for review manually from ASC once the listing is complete.
        submit_to_app_store: false
        # Cancel any stale submissions so retried builds never hit a
        # "build already submitted" conflict.
        cancel_previous_submissions: true
