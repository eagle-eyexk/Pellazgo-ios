workflows:
  pellazgo-ios:
    name: Pellazgo iOS Release
    max_build_duration: 90

    integrations:
      app_store_connect: pellazgo_asc

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pellazgo.pellazgo

      vars:
        APP_ID: "6782613978"
        BUNDLE_ID: "com.pellazgo.pellazgo"
        PROJECT_DIR: "artifacts/pellazgo"
        IOS_DIR: "artifacts/pellazgo/ios"
        WORKSPACE: "Pellazgo.xcworkspace"
        SCHEME: "Pellazgo"

    triggering:
      events:
        - push

      branch_patterns:
        - pattern: main
          include: true

    scripts:

      - name: Install Node dependencies
        script: |
          npm install -g pnpm
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npx expo prebuild --platform ios --clean

      - name: Clean CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          pod deintegrate || true
          rm -rf Pods
          rm -f Podfile.lock

      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          pod repo update
          pod install --repo-update

      - name: Install Signing
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"
          xcode-project use-profiles

      - name: Increment Build Number
        script: |
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((BUILD_NUMBER+1))

          cd "$CM_BUILD_DIR/$IOS_DIR"

          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIR"

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --archive-flags="-configuration Release"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/gym/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false